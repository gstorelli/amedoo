server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # probe per docker/compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # immagini: cache lunga (i nomi cambiano quando cambia il contenuto)
    location ~* \.(?:webp|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # statuto PDF
    location ~* \.pdf$ {
        expires 7d;
    }

    # testi editabili dall'area riservata: mai in cache
    location = /contenuti.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # HTML sempre rivalidato (expires -1 non azzera gli header ereditati come farebbe add_header)
    location = /index.html {
        expires -1;
    }

    # Area riservata: inoltrata al container `admin` (nessun sottodominio necessario)
    location = /gestione {
        return 301 /gestione/;
    }

    location /gestione/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream http://admin:8000;
        rewrite ^/gestione/(.*)$ /$1 break;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
