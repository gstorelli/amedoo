server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # probe per docker/compose
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # immagini: cache lunga (i nomi cambiano quando cambia il contenuto)
    location ~* \.(?:webp|png|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # statuto PDF
    location ~* \.pdf$ {
        expires 7d;
    }

    # testi editabili dall'area riservata: mai in cache
    location = /contenuti.json {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # HTML sempre rivalidato (expires -1 non azzera gli header ereditati come farebbe add_header)
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
